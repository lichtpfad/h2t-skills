[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "h2t-ops"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = [
  "notion-client>=2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.0",
  "tzdata>=2024.1",
  "telethon>=1.36,<1.43",
  "rapidocr-onnxruntime>=1.3.24",
  "youtube-transcript-api>=0.6",
  # payload scripts the console entrypoints load (#357): apply_registration.py needs
  # ruamel.yaml to keep comments in the h2t config, scan.py reads projects.yaml
  "ruamel.yaml>=0.18",
  "PyYAML>=6.0",
]

[project.scripts]
h2t-ops = "h2t_ops.cli:main"
h2t-gather = "h2t_ops.gather_entry:main"
h2t-activity-log = "h2t_ops.activity_log_entry:main"
h2t-handoff = "h2t_ops.handoff_entry:main"
h2t-project-audit-scan = "h2t_ops.project_audit_scan_entry:main"
h2t-project-audit-report = "h2t_ops.project_audit_report_entry:main"
h2t-project-register = "h2t_ops.project_register_entry:main"
h2t-scaffold-project = "h2t_ops.scaffold_project_entry:main"
h2t-hook = "h2t_ops.hook_entry:main"

[tool.hatch.build.targets.wheel]
# `lib` is not shipped as a top-level package: it is about as generic a name as a
# distribution can claim in site-packages, and the payload below already carries the
# same modules where every entry point looks for them.
packages = ["h2t_ops"]

# The three thin entrypoints load plugin-owned scripts. Ship them inside the wheel so
# `uv tool install` alone is enough on a host with no plugin cache — Codex-only
# machines, CI, bare servers. plugin_entrypoints prefers an installed plugin over this
# copy; it is the last resort, not the default.
[tool.hatch.build.targets.wheel.force-include]
"plugins/h2t-core/lib" = "h2t_ops/_plugin_payload/lib"
"plugins/h2t-core/skills/handoff/scripts/writer.py" = "h2t_ops/_plugin_payload/skills/handoff/scripts/writer.py"
"plugins/h2t-core/skills/session-start/scripts/gather.py" = "h2t_ops/_plugin_payload/skills/session-start/scripts/gather.py"
"plugins/h2t-core/skills/project-audit/scripts/scan.py" = "h2t_ops/_plugin_payload/skills/project-audit/scripts/scan.py"
"plugins/h2t-core/skills/project-audit/scripts/report.py" = "h2t_ops/_plugin_payload/skills/project-audit/scripts/report.py"
"plugins/h2t-core/skills/init-project/scripts/apply_registration.py" = "h2t_ops/_plugin_payload/skills/init-project/scripts/apply_registration.py"
"plugins/h2t-core/skills/scaffold-project/scripts/scaffold_project.py" = "h2t_ops/_plugin_payload/skills/scaffold-project/scripts/scaffold_project.py"
# h2t-hook resolves hooks-handlers/<name> through the same ladder. On a host with no
# plugin cache the payload is the only carrier, and a hook that resolves to nothing is
# silent — the whole point of the launcher is that a scaffolded project keeps working
# on a machine that never installed the plugin.
"plugins/h2t-core/hooks-handlers" = "h2t_ops/_plugin_payload/hooks-handlers"

[tool.ruff]
target-version = "py311"
# plugins/h2t/ is a rollback archive, not shipped (tests/core/test_skill_frontmatter.py:22).
# Linting it would report defects in code that is deliberately frozen.
extend-exclude = ["plugins/h2t/"]

[tool.ruff.lint]
# Pinned explicitly. Ruff's default set is large and grows with each release — 0.16.4
# enables 413 rules and reported 1625 findings here, almost all on untouched files, which
# made every finding a question of "mine or pre-existing?" rather than a signal.
# E/F are correctness, I import order, UP the py311 idioms this repo already targets.
# BLE/PLW/S/DTZ are deliberately out: they carry real signal, but ~250 findings at once
# would train everyone to scroll past them.
select = ["E4", "E7", "E9", "F", "I", "UP"]
# F401 is enabled and never auto-fixed. The 101 markers this repo carried were resolved
# import by import on 2026-08-24 (#400); six survive, each on a single-name statement with
# the reason on the line. `ruff --fix` across everything once removed test-facing
# re-exports and took 14 tests down: meetgeek_cli aliases recovery helpers it never calls,
# and `import subprocess` there exists only so tests can patch cli.subprocess.run. Whether
# an unused import is dead or an interface cannot be decided mechanically, so it stays a
# human decision — the safe way to clear one is `--isolated --fix` on a vetted file list.
unfixable = ["F401"]

# No `ignore`. E702/E701/E741/UP035 were deferred here on 2026-08-24 as "117 findings, not
# worth the diff"; the measurement behind that was wrong — they sat in 23 files, three of
# which held 68 of them, and the sweep took one pass. A rule left in `ignore` is off for the
# whole repo, so the next semicolon would have landed unnoticed. Nothing is suppressed
# repo-wide any more; the narrow, justified suppressions live in per-file-ignores below.

[tool.ruff.lint.per-file-ignores]
# Scripts and tests put a directory on sys.path before importing from it, so the import
# cannot be hoisted above that line.
"plugins/**/scripts/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]

# F821 here is a real NameError, not noise: `_create_notion_tasks` reads an undefined
# REPO_ROOT. The function is dead (no caller anywhere), and whether it comes back with a
# real anchor or goes is a telegram-skill decision, not a lint one — tracked in #399.
"plugins/h2t-ops/skills/telegram/scripts/telegram_cli.py" = ["E402", "F821"]

[tool.pytest.ini_options]
pythonpath = ["."]

# PEP 735 — provisioned by `uv run`/`uv sync`; ignored by bare `pip install`.
[dependency-groups]
dev = [
  "pytest>=8",
]
