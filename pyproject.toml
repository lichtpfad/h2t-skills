[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "h2t-ops"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = [
  "notion-client>=2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.0",
  "tzdata>=2024.1",
  "telethon>=1.36,<1.43",
  "rapidocr-onnxruntime>=1.3.24",
  "youtube-transcript-api>=0.6",
]

[project.scripts]
h2t-ops = "h2t_ops.cli:main"
h2t-gather = "h2t_ops.gather_entry:main"
h2t-activity-log = "h2t_ops.activity_log_entry:main"
h2t-handoff = "h2t_ops.handoff_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["h2t_ops*", "lib*"]

[tool.setuptools.package-data]
"h2t_ops.connectors.research" = ["systemprompts/*.md"]

# PEP 735 — provisioned by `uv run`/`uv sync`; ignored by bare `pip install`.
[dependency-groups]
dev = [
  "pytest>=8",
]
