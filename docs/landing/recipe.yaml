  - component: section
    content:
      title: "Что это"
      body: |
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
        body { counter-reset: sec; }
