# Reusable checks for every h2t repo. One file, changed in one place.
#
# Lives here, not in h2t-infra, for one reason: this repo is public and h2t-infra is
# private, and GitHub lets a public repo call only public reusable workflows. h2t-skills
# itself was the first caller to fail on that rule (run 34277198305, 0 s, no jobs).
# Private repos can call a public workflow, so every h2t repo can call this one.
#
# Origin: cross-repo audit 2026-09 (h2t-infra, research/2026-09-repo-audit/summary.md).
# The audit found rules written and violated, docs pointing at standards that do not
# exist, and "done" flags with nothing behind them. None of it was caught because
# nothing ran.
#
# A caller repo adds .github/workflows/checks.yml with:
#
#   jobs:
#     checks:
#       permissions: { contents: read, issues: read }   # closed-without-trace reads issues
#       uses: lichtpfad/h2t-skills/.github/workflows/h2t-checks.yml@main
#       with: { ruff: true, pytest: true }
#       secrets: inherit      # the caller repo defines INFRA_TOKEN (or does not — then the standards tier says so)
#
# Two tiers of jobs:
#   self-contained  — ruff, pytest, gitleaks: need nothing but the caller repo. Block.
#   standards       — docs-lint, layout vs standard, dangling standard refs: need a
#                     checkout of h2t-infra (private) and this repo. They run only when the
#                     caller has an INFRA_TOKEN secret (a fine-grained PAT with read access
#                     to h2t-infra) and passes `secrets: inherit`; soft (continue-on-error)
#                     until `soft: false`. No token → the job says so and exits green.
#                     Silence is not a pass.
#
# ruff: the caller's own config applies (pyproject/ruff.toml). Without one, ruff ≥0.16
# defaults to a broad rule set (FURB, PLW, BLE…) — h2t-infra hit 38 findings that way.
# Pin `select` explicitly in every repo.

name: h2t-checks

on:
  workflow_call:
    inputs:
      python-version: { type: string,  default: "3.11" }
      ruff:           { type: boolean, default: true }
      ruff-paths:     { type: string,  default: "." }
      pytest:         { type: boolean, default: true }
      pytest-args:    { type: string,  default: "-q -x" }
      install:        { type: string,  default: "" }   # e.g. pip install -e ".[dev]"; empty → pip install -e . if pyproject exists
      working-dir:    { type: string,  default: "." }
      gitleaks:       { type: boolean, default: true }
      standards:      { type: boolean, default: true }
      soft:           { type: boolean, default: true }  # standards tier: continue-on-error
      runner:         { type: string,  default: "\"ubuntu-latest\"" }  # JSON: "ubuntu-latest" or ["self-hosted","h2t-automata"]
    secrets:
      INFRA_TOKEN:
        required: false

env:
  GITLEAKS_VERSION: "8.30.1"

# The steps are bash. `bash -e {0}` is exactly the Linux default, so hosted runs do not change;
# on a Windows self-hosted runner it selects Git Bash instead of the PowerShell default.
defaults:
  run:
    shell: bash -e {0}

jobs:
  ruff:
    if: ${{ inputs.ruff }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Git Bash on PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin", "$env:ProgramFiles\Git\usr\bin"   # bash + grep/awk/sed
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with: { python-version: "${{ inputs.python-version }}" }
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'Windows'
        with: { python-version: "${{ inputs.python-version }}", activate-environment: true }
      - run: if command -v uv >/dev/null; then uv pip install ruff; else pip install ruff; fi
      - name: ruff check
        working-directory: ${{ inputs.working-dir }}
        run: ruff check ${{ inputs.ruff-paths }}

  pytest:
    if: ${{ inputs.pytest }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Git Bash on PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin", "$env:ProgramFiles\Git\usr\bin"   # bash + grep/awk/sed
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with: { python-version: "${{ inputs.python-version }}", cache: pip }
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'Windows'
        with: { python-version: "${{ inputs.python-version }}", activate-environment: true }
      - name: install
        working-directory: ${{ inputs.working-dir }}
        shell: bash
        run: |
          if command -v uv >/dev/null; then uv pip install pytest; else python -m pip install --upgrade pip pytest; fi
          if [ -n "${{ inputs.install }}" ]; then
            ${{ inputs.install }}
          elif [ -f pyproject.toml ]; then
            pip install -e . || pip install -e ".[dev]"
          fi
      - name: pytest
        working-directory: ${{ inputs.working-dir }}
        run: python -m pytest ${{ inputs.pytest-args }}

  layout:
    # Self-contained and blocking: docs/superpowers/plans|specs hold dated Markdown only.
    # h2t-transcription had 200 other files there at the 2026-09 audit (dumps, scripts,
    # transcripts, logs) — the directory nearest to the work became the scratch place.
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Git Bash on PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin", "$env:ProgramFiles\Git\usr\bin"   # bash + grep/awk/sed
      - name: plans/specs contain plans only
        run: |
          bad=$(git ls-files docs/superpowers/plans docs/superpowers/specs \
                | grep -vE '^docs/superpowers/(plans|specs)/([0-9]{4}-[0-9]{2}-[0-9]{2}-[^/]+\.md|README\.md|index\.md|\.gitkeep)$' || true)
          if [ -n "$bad" ]; then
            echo "::error title=layout::$(echo "$bad" | wc -l) file(s) in docs/superpowers/{plans,specs} are not plans"
            echo "$bad"
            exit 1
          fi
          echo "plans/specs clean"

  closed-without-trace:
    # An issue closed in the last 7 days must have a commit that names it (#N) — anywhere in
    # history — unless it was closed as not planned. "closes #N" is written in CLAUDE.md;
    # this is the mechanism. Self-contained: GITHUB_TOKEN reads issues of the calling repo.
    # Needs `issues: read` on the token. A called workflow may only DOWNGRADE the caller's
    # permissions; asking for more here is a startup_failure ("nested job is requesting
    # issues: read but is only allowed issues: none") — that is how run e40544e died. So the
    # CALLER grants it: `permissions: { contents: read, issues: read }` on its `checks` job.
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Git Bash on PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin", "$env:ProgramFiles\Git\usr\bin"   # bash + grep/awk/sed
      - name: closed issues have a commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '7 days ago' +%Y-%m-%d)
          bad=""
          while IFS=$'\t' read -r num reason; do
            [ -z "$num" ] && continue
            [ "$reason" = "NOT_PLANNED" ] && continue
            # `#394` (closing keywords) or `[394]` (h2t-transcription titles its commits that way)
            if ! git log --all --oneline -E --grep="(#|\[)${num}([^0-9]|$)" | grep -q .; then
              bad="$bad #$num"
            fi
          done < <(gh issue list --state closed --search "closed:>=$since" --limit 100 --json number,stateReason --jq '.[] | "\(.number)\t\(.stateReason)"')
          if [ -n "$bad" ]; then
            echo "::error title=closed-without-trace::issues closed since $since with no commit naming them:$bad"
            echo "Reopen, or close as 'not planned', or push the commit with 'closes #N'."
            exit 1
          fi
          echo "every issue closed since $since has a commit"

  truth-gate:
    # The three answers written by /h2t-core:init-project (source of truth, stage-run record,
    # data contract) are commands; here they run. Empty output or non-zero exit = red.
    # No `## Truth gate` table in CLAUDE.md → notice, green: the gate has not been asked yet.
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Git Bash on PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin", "$env:ProgramFiles\Git\usr\bin"   # bash + grep/awk/sed
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with: { python-version: "${{ inputs.python-version }}" }
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'Windows'
        with: { python-version: "${{ inputs.python-version }}", activate-environment: true }
      - name: run the truth gate commands
        shell: bash
        run: |
          [ -f CLAUDE.md ] || { echo "::notice title=truth-gate::no CLAUDE.md"; exit 0; }
          table=$(awk '/^## Truth gate/{f=1;next} /^## /{f=0} f' CLAUDE.md)
          [ -n "$table" ] || { echo "::notice title=truth-gate::no '## Truth gate' table in CLAUDE.md — run /h2t-core:init-project"; exit 0; }
          fail=0
          while IFS= read -r line; do
            cmd=$(printf '%s' "$line" | sed -nE 's/^\|[^|]*\|[^|]*\|[[:space:]]*`([^`]+)`[[:space:]]*\|.*$/\1/p')
            [ -z "$cmd" ] && continue
            q=$(printf '%s' "$line" | awk -F'|' '{gsub(/^ +| +$/,"",$3); print $3}')
            out=$(bash -c "$cmd" 2>&1) || { echo "::error title=truth-gate::[$q] exit≠0: $cmd"; echo "$out" | head -5; fail=1; continue; }
            if [ -z "$(printf '%s' "$out" | tr -d '[:space:]')" ]; then
              echo "::error title=truth-gate::[$q] empty output: $cmd"; fail=1; continue
            fi
            echo "[$q] green: $cmd"; echo "$out" | head -3
          done <<< "$table"
          exit $fail

  gitleaks:
    if: ${{ inputs.gitleaks }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # history, not just the tip: a secret removed later is still a leak
      - name: Git Bash on PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin", "$env:ProgramFiles\Git\usr\bin"   # bash + grep/awk/sed
      - name: install gitleaks (binary from release, no license needed)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: install gitleaks (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "gitleaks.zip"
          $dir = Join-Path $env:RUNNER_TEMP "gitleaks"
          Invoke-WebRequest "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/gitleaks_$($env:GITLEAKS_VERSION)_windows_x64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          Add-Content $env:GITHUB_PATH $dir
      - name: gitleaks git history
        run: gitleaks git --redact --no-banner --exit-code 1 .

  standards:
    if: ${{ inputs.standards }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    continue-on-error: ${{ inputs.soft }}
    env:
      INFRA_TOKEN: ${{ secrets.INFRA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Git Bash on PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin", "$env:ProgramFiles\Git\usr\bin"   # bash + grep/awk/sed
      - name: token present?
        id: tok
        run: |
          if [ -z "$INFRA_TOKEN" ]; then
            echo "::notice title=h2t-checks::standards tier skipped — no INFRA_TOKEN secret (fine-grained PAT, read access to lichtpfad/h2t-infra)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.present == 'true'
        with: { repository: lichtpfad/h2t-infra, token: "${{ secrets.INFRA_TOKEN }}", path: _infra }
      - uses: actions/checkout@v4
        if: steps.tok.outputs.present == 'true'
        with: { repository: lichtpfad/h2t-skills, path: _skills }
      - uses: actions/setup-python@v5
        if: steps.tok.outputs.present == 'true'
        with: { python-version: "${{ inputs.python-version }}" }
      - name: dangling standard refs
        if: steps.tok.outputs.present == 'true'
        run: python _infra/standards/scripts/check_standard_refs.py --repo . --standards _infra/standards
      - name: layout vs documentation-structure.md
        if: steps.tok.outputs.present == 'true'
        run: python _infra/standards/scripts/repo_audit/audit_tree.py --repo . --structure-doc _infra/standards/documentation-structure.md
      - name: docs-lint audit
        if: steps.tok.outputs.present == 'true'
        run: |
          pip install pyyaml
          # docs-lint is package code since Task 12 (#541); it needs only PyYAML, so the
          # checkout is put on the path instead of installing h2t-ops and its connectors.
          PYTHONPATH=_skills python -m h2t_ops.tools.docs.lint audit --root . --no-pymarkdown
      - name: stale plans (report only — docs-lint retire always exits 0 by design)
        if: steps.tok.outputs.present == 'true'
        run: PYTHONPATH=_skills python -m h2t_ops.tools.docs.lint retire --root . --older-than 60
