# Reusable checks for every h2t repo. One file, changed in one place.
#
# Lives here, not in h2t-infra, for one reason: this repo is public and h2t-infra is
# private, and GitHub lets a public repo call only public reusable workflows. h2t-skills
# itself was the first caller to fail on that rule (run 34277198305, 0 s, no jobs).
# Private repos can call a public workflow, so every h2t repo can call this one.
#
# Origin: cross-repo audit 2026-09 (h2t-infra, research/2026-09-repo-audit/summary.md).
# The audit found rules written and violated, docs pointing at standards that do not
# exist, and "done" flags with nothing behind them. None of it was caught because
# nothing ran.
#
# A caller repo adds .github/workflows/checks.yml with:
#
#   jobs:
#     checks:
#       uses: lichtpfad/h2t-skills/.github/workflows/h2t-checks.yml@main
#       with: { ruff: true, pytest: true }
#       secrets: inherit      # the caller repo defines INFRA_TOKEN (or does not — then the standards tier says so)
#
# Two tiers of jobs:
#   self-contained  — ruff, pytest, gitleaks: need nothing but the caller repo. Block.
#   standards       — docs-lint, layout vs standard, dangling standard refs: need a
#                     checkout of h2t-infra (private) and this repo. They run only when the
#                     caller has an INFRA_TOKEN secret (a fine-grained PAT with read access
#                     to h2t-infra) and passes `secrets: inherit`; soft (continue-on-error)
#                     until `soft: false`. No token → the job says so and exits green.
#                     Silence is not a pass.
#
# ruff: the caller's own config applies (pyproject/ruff.toml). Without one, ruff ≥0.16
# defaults to a broad rule set (FURB, PLW, BLE…) — h2t-infra hit 38 findings that way.
# Pin `select` explicitly in every repo.

name: h2t-checks

on:
  workflow_call:
    inputs:
      python-version: { type: string,  default: "3.11" }
      ruff:           { type: boolean, default: true }
      ruff-paths:     { type: string,  default: "." }
      pytest:         { type: boolean, default: true }
      pytest-args:    { type: string,  default: "-q -x" }
      install:        { type: string,  default: "" }   # e.g. pip install -e ".[dev]"; empty → pip install -e . if pyproject exists
      working-dir:    { type: string,  default: "." }
      gitleaks:       { type: boolean, default: true }
      standards:      { type: boolean, default: true }
      soft:           { type: boolean, default: true }  # standards tier: continue-on-error
    secrets:
      INFRA_TOKEN:
        required: false

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  ruff:
    if: ${{ inputs.ruff }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ inputs.python-version }}" }
      - run: pip install ruff
      - name: ruff check
        working-directory: ${{ inputs.working-dir }}
        run: ruff check ${{ inputs.ruff-paths }}

  pytest:
    if: ${{ inputs.pytest }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ inputs.python-version }}", cache: pip }
      - name: install
        working-directory: ${{ inputs.working-dir }}
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          if [ -n "${{ inputs.install }}" ]; then
            ${{ inputs.install }}
          elif [ -f pyproject.toml ]; then
            pip install -e . || pip install -e ".[dev]"
          fi
      - name: pytest
        working-directory: ${{ inputs.working-dir }}
        run: python -m pytest ${{ inputs.pytest-args }}

  layout:
    # Self-contained and blocking: docs/superpowers/plans|specs hold dated Markdown only.
    # h2t-transcription had 200 other files there at the 2026-09 audit (dumps, scripts,
    # transcripts, logs) — the directory nearest to the work became the scratch place.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: plans/specs contain plans only
        run: |
          bad=$(git ls-files docs/superpowers/plans docs/superpowers/specs \
                | grep -vE '^docs/superpowers/(plans|specs)/([0-9]{4}-[0-9]{2}-[0-9]{2}-[^/]+\.md|README\.md|index\.md|\.gitkeep)$' || true)
          if [ -n "$bad" ]; then
            echo "::error title=layout::$(echo "$bad" | wc -l) file(s) in docs/superpowers/{plans,specs} are not plans"
            echo "$bad"
            exit 1
          fi
          echo "plans/specs clean"

  gitleaks:
    if: ${{ inputs.gitleaks }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # history, not just the tip: a secret removed later is still a leak
      - name: install gitleaks (binary from release, no license needed)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: gitleaks git history
        run: gitleaks git --redact --no-banner --exit-code 1 .

  standards:
    if: ${{ inputs.standards }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.soft }}
    env:
      INFRA_TOKEN: ${{ secrets.INFRA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: token present?
        id: tok
        run: |
          if [ -z "$INFRA_TOKEN" ]; then
            echo "::notice title=h2t-checks::standards tier skipped — no INFRA_TOKEN secret (fine-grained PAT, read access to lichtpfad/h2t-infra)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.present == 'true'
        with: { repository: lichtpfad/h2t-infra, token: "${{ secrets.INFRA_TOKEN }}", path: _infra }
      - uses: actions/checkout@v4
        if: steps.tok.outputs.present == 'true'
        with: { repository: lichtpfad/h2t-skills, path: _skills }
      - uses: actions/setup-python@v5
        if: steps.tok.outputs.present == 'true'
        with: { python-version: "${{ inputs.python-version }}" }
      - name: dangling standard refs
        if: steps.tok.outputs.present == 'true'
        run: python _infra/standards/scripts/check_standard_refs.py --repo . --standards _infra/standards
      - name: layout vs documentation-structure.md
        if: steps.tok.outputs.present == 'true'
        run: python _infra/standards/scripts/repo_audit/audit_tree.py --repo . --structure-doc _infra/standards/documentation-structure.md
      - name: docs-lint audit
        if: steps.tok.outputs.present == 'true'
        run: |
          pip install pyyaml
          python _skills/plugins/h2t-dev/skills/docs-lint/scripts/lint.py audit --root . --no-pymarkdown
