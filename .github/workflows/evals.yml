name: h2t-evals gate

on:
  push:
    branches: [main]
  # No `branches:` filter here on purpose: it matches the PR *base*, so a stacked PR
  # whose base is another feature branch would get no gate at all until retargeted.
  pull_request:

jobs:
  unit-tests:
    name: lib/ unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install -e . pytest

      - name: Run lib/ unit tests
        run: python -m pytest lib/ -v --tb=short

      - name: Run h2t-ops tests
        # Whole tests/ tree: tests/docs and tests/deploy were outside CI, which is how
        # their Windows-only assumptions survived (#353 era: 9 red on macOS, 0 in CI).
        run: python -m pytest tests/ -q

      - name: Run autonomous-run skill tests
        run: python -m pytest plugins/h2t-core/skills/autonomous-run/scripts -q

      - name: Run init-project skill tests
        # Outside CI these rotted into Windows-only assumptions — a literal "E:/DROPBOX/..."
        # cwd wrote a stray tree into the repo on POSIX, and "/some/path" hit the read-only
        # root (#378, same family as #355).
        run: python -m pytest plugins/h2t-core/skills/init-project/scripts -q

      # Ten more directories held assertions GitHub had never run (#381) — 968 in
      # h2t-creative alone, plus the 87 meetgeek tests merged in #389/#390. Each gets its
      # own step because they cannot share one invocation: plugins/h2t-ops/skills/research/
      # tests is also named `tests`, so collecting it beside the repo's tests/ package dies
      # on `ModuleNotFoundError: No module named 'tests.core'`. All twelve directories run
      # now — drawio joined once its smoke scripts became real test functions (#396); its
      # export test skips on a runner, loudly, because the draw.io Desktop CLI is absent.
      - name: Plugin tests — h2t-core vendored lib
        run: python -m pytest plugins/h2t-core/lib/gather -q
      - name: Plugin tests — h2t-core bootstrap scripts
        run: python -m pytest plugins/h2t-core/scripts/tests -q
      - name: Plugin tests — agent-profile skill
        run: python -m pytest plugins/h2t-core/skills/agent-profile/scripts -q
      - name: Plugin tests — handoff skill
        run: python -m pytest plugins/h2t-core/skills/handoff/scripts -q
      - name: Plugin tests — scaffold-project skill
        run: python -m pytest plugins/h2t-core/skills/scaffold-project/scripts -q
      - name: Plugin tests — setup skill
        run: python -m pytest plugins/h2t-core/skills/setup/scripts -q
      - name: Plugin tests — h2t-creative
        run: python -m pytest plugins/h2t-creative/tests -q
      - name: Plugin tests — connectors skill
        run: python -m pytest plugins/h2t-ops/skills/connectors/scripts -q
      - name: Plugin tests — meetgeek skill
        run: python -m pytest plugins/h2t-ops/skills/meetgeek/tests -q
      - name: Plugin tests — research skill
        run: python -m pytest plugins/h2t-ops/skills/research/tests -q
      - name: Plugin tests — drawio skill
        run: python -m pytest plugins/h2t-arch/skills/drawio/scripts -q -rs

  eval-gate:
    name: h2t-evals validate-repo
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate evals/repo.toml parses
        run: |
          python -c "import tomllib; tomllib.load(open('evals/repo.toml','rb')); print('evals/repo.toml: valid TOML')"

      - name: h2t-evals validate-repo (requires service token)
        env:
          H2T_EVALS_ENABLED: ${{ secrets.H2T_EVALS_ENABLED || '0' }}
          H2T_EVALS_SERVICE_URL: ${{ secrets.H2T_EVALS_SERVICE_URL || '' }}
          H2T_EVALS_TOKEN: ${{ secrets.H2T_EVALS_TOKEN || '' }}
        run: |
          if [ "$H2T_EVALS_ENABLED" = "1" ] && [ -n "$H2T_EVALS_SERVICE_URL" ]; then
            pip install -e . 2>/dev/null || true
            h2t-evals validate-repo --repo h2t-skills --repo-config evals/repo.toml
          else
            echo "BLOCKED: H2T_EVALS_TOKEN not provisioned for this repo."
            echo "Service token must be added as GitHub secret H2T_EVALS_TOKEN by platform team."
            echo "Unit tests (above) are the hard gate until token is provisioned."
          fi
