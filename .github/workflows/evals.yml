name: h2t-evals gate

on:
  push:
    branches: [main]
  # No `branches:` filter here on purpose: it matches the PR *base*, so a stacked PR
  # whose base is another feature branch would get no gate at all until retargeted.
  pull_request:

jobs:
  unit-tests:
    name: lib/ unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows had never run this suite: both jobs were ubuntu-latest since the file was
    # written, so every Windows-only assumption in the tree was unmeasured rather than
    # absent — the same blind spot #353, #378 and #381 came out of, one platform over.
    # The leg was added under continue-on-error, because a red leg nobody had read yet
    # must not block a merge. It has been read: the first probe reported 7 failures, the
    # second 5 more across directories the first never reached, and all of them are
    # fixed (#427). The leg gates from here — coverage that cannot fail the build rots
    # red unnoticed, which is the state those 13 directories were already in.
    strategy:
      # Without this a Windows failure cancels the Linux leg, and the run that was
      # supposed to add information would remove some.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # Same shell on both runners. The question this probe answers is whether our
        # Python runs on Windows; pwsh-vs-bash differences in these step bodies would
        # be noise on top of it. Git Bash ships with the Windows runner.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The issue-link ratchet diffs against the base, so a shallow clone with one
          # commit gives it nothing to compare and it passes on everything.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Plans and specs name their work
        # Scoped to what this change touched, not to the tree. 74 documents predate the
        # `issue` field (#421); a gate red on day one for historical reasons is disabled
        # within a week, and then guards nothing. History is fixed deliberately, growth is
        # stopped here (#423).
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install pyyaml
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          python scripts/check_issue_links.py "$BASE"

      - name: Lint
        # The rule set is pinned in pyproject.toml; ruff's own default grows with each
        # release. Without this step the pinned set drifts back into noise within a month.
        run: |
          python -m pip install --quiet ruff==0.16.4
          ruff check plugins/ lib/ h2t_ops/ tests/ scripts/
      - name: Install test deps
        # The drawio extra: tests/tools/drawio runs the package generator, which needs drawpyo.
        run: pip install -e ".[drawio]" pytest

      - name: Run lib/ unit tests
        # A step that stops the job hides every step after it: the first Windows probe
        # reported 7 failures and left 13 test directories unrun, which reads as coverage
        # it never had. The leg is here to enumerate, so each step runs regardless.
        if: ${{ !cancelled() }}
        run: python -m pytest lib/ -v --tb=short

      - name: Run h2t-ops tests
        if: ${{ !cancelled() }}
        # Whole tests/ tree: tests/docs and tests/deploy were outside CI, which is how
        # their Windows-only assumptions survived (#353 era: 9 red on macOS, 0 in CI).
        # plugins/ ships text only since Task 12 (#541): its test directories moved here,
        # and tests/core/test_ci_covers_plugin_tests.py keeps new ones out.
        # GH_TOKEN: tests/release/test_release_pointer.py asks `gh release view` whether the
        # tag main points at has a Release with the wheel (spec §9.9); without it, it skips.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pytest tests/ -q

  eval-gate:
    name: h2t-evals validate-repo
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate evals/repo.toml parses
        run: |
          python -c "import tomllib; tomllib.load(open('evals/repo.toml','rb')); print('evals/repo.toml: valid TOML')"

      - name: h2t-evals validate-repo (requires service token)
        env:
          H2T_EVALS_ENABLED: ${{ secrets.H2T_EVALS_ENABLED || '0' }}
          H2T_EVALS_SERVICE_URL: ${{ secrets.H2T_EVALS_SERVICE_URL || '' }}
          H2T_EVALS_TOKEN: ${{ secrets.H2T_EVALS_TOKEN || '' }}
        run: |
          if [ "$H2T_EVALS_ENABLED" = "1" ] && [ -n "$H2T_EVALS_SERVICE_URL" ]; then
            pip install -e . 2>/dev/null || true
            h2t-evals validate-repo --repo h2t-skills --repo-config evals/repo.toml
          else
            echo "BLOCKED: H2T_EVALS_TOKEN not provisioned for this repo."
            echo "Service token must be added as GitHub secret H2T_EVALS_TOKEN by platform team."
            echo "Unit tests (above) are the hard gate until token is provisioned."
          fi
