name: Задача
description: Единица работы на одну сессию агента. Без ответов на поля задача не заводится.
title: "<type>: "
labels: ["status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Одна задача — один проверяемый критерий приёмки.** Если критериев два и они независимы, это две задачи.
        Работа, которая не помещается в одну сессию агента, ведётся через план в `docs/superpowers/plans/`,
        а сюда попадают её отдельные этапы.
        Не забудь проставить метки `type:`, `priority:` и `domain:` — без них задача не принимается.

  - type: textarea
    id: outcome
    attributes:
      label: Что станет возможно
      description: Одно предложение. Не «сделать X», а «после этого можно Y».
    validations:
      required: true

  - type: textarea
    id: existing
    attributes:
      label: Готовое решение проверено
      description: >
        Что уже умеет платформа, библиотека или фреймворк, и почему этого не хватает.
        Если пишем своё — какой конкретный пробел закрываем. «Не проверял» — не ответ.
    validations:
      required: true

  - type: textarea
    id: truth
    attributes:
      label: Где живёт истина
      description: >
        Где после изменения находится авторитетное состояние: таблица, файл, сервис.
        Если появляется второй независимо изменяемый источник того же факта — задача не принимается.
    validations:
      required: true

  - type: textarea
    id: invariant
    attributes:
      label: Инвариант и чем он удержан
      description: >
        Что должно стать невозможным — и на каком уровне это удерживается:
        ограничение базы → инвариант фреймворка → схема или типы → тест → линтер или хук.
        «Инструкция агенту» уровнем удержания не считается.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Приёмка
      description: >
        Команда и её ожидаемый вывод. Плюс как проверка краснеет:
        сломать вход → красный → починить → зелёный.
      placeholder: |
        $ python3 scripts/acceptance_gate.py
        PASS
    validations:
      required: true

  - type: textarea
    id: nongoals
    attributes:
      label: Что НЕ входит
      description: Явные границы. Здесь же — где задача считается законченной, чтобы ревью не превращалось в бесконечный поиск.
    validations:
      required: true

  - type: dropdown
    id: irreversible
    attributes:
      label: Необратимое решение
      description: >
        Затрагивает ли задача что-то из списка: единица предметной области и её ключ,
        карта «где живёт истина», выбор хранилища, жизненный цикл и поведение при отказе,
        внешний контракт. Это решения, которые завтра дороже переиграть, чем сегодня.
      options:
        - "нет — ничего из списка не затрагивается"
        - "да — решение принято, ссылка на ADR ниже"
        - "да — решения нет, задача заблокирована до него"
    validations:
      required: true

  - type: input
    id: links
    attributes:
      label: Связи
      description: ADR, спека, родительская задача, план. Ссылками, не пересказом.
