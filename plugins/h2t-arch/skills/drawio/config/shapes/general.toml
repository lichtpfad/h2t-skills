title = "General Shapes"
version = "1.0.0"

[_edge_defaults]
routing = "orthogonal"
arrow = "classic"
fontSize = 11
fontColor = "#333333"
strokeWidth = 1.5

[rectangle]
baseStyle = "rounded=0"
width = 120
height = 60
fillColor = "#dae8fc"
strokeColor = "#6c8ebf"
fontColor = "#333333"

[rounded_rect]
baseStyle = "rounded=1"
width = 120
height = 60
fillColor = "#d5e8d4"
strokeColor = "#82b366"
fontColor = "#333333"

[ellipse]
baseStyle = "ellipse"
width = 120
height = 60
fillColor = "#fff2cc"
strokeColor = "#d6b656"
fontColor = "#333333"

[diamond]
baseStyle = "rhombus"
width = 80
height = 80
fillColor = "#f8cecc"
strokeColor = "#b85450"
fontColor = "#333333"

[cylinder]
baseStyle = "shape=cylinder3;size=10"
width = 100
height = 60
fillColor = "#e1d5e7"
strokeColor = "#9673a6"
fontColor = "#333333"

[hexagon]
baseStyle = "shape=hexagon;perimeter=hexagonPerimeter2"
width = 120
height = 60
fillColor = "#f5f5f5"
strokeColor = "#666666"
fontColor = "#333333"

[note]
baseStyle = "shape=note;size=14"
width = 100
height = 60
fillColor = "#fff2cc"
strokeColor = "#d6b656"
fontColor = "#333333"

[swimlane]
baseStyle = "swimlane;startSize=30"
fillColor = "#f5f5f5"
strokeColor = "#666666"
fontColor = "#333333"

[_edges]
process_internal = "#6c8ebf"
external = "#999999"
storage = "#9673a6"
