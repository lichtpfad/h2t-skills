  - component: problem-grid
    content:
      title: "The Problem"
      cards_html: |
        <div class="card">
          <div class="card-num">01</div>
          <div class="card-label">Diagram ≠ Docs</div>
          <div class="card-text">draw.io in one place, Notion in another. They diverge in hours. Agent works from an outdated version.</div>
        </div>
        <div class="card">
          <div class="card-num">02</div>
          <div class="card-label">One File For All</div>
          <div class="card-text">CLAUDE.md = 1 file for entire project. Doesn't scale past 5 modules. Agent drowns in 10K tokens of noise.</div>
        </div>
        <div class="card">
          <div class="card-num">03</div>
          <div class="card-label">Docs Drift</div>
          <div class="card-text">Specs live in chats, notes, boards. Every new session starts from scratch. No contract, no continuity.</div>
        </div>

  - component: pipeline-svg
    content:
      title: "How It Works"
      quote: '"Diagram and spec are one object. They never diverge."'

  - component: c4-grid
    content:
      title: "Built on C4"
      rows_html: |
        <div class="c4-row">
          <div class="c4-level"><span class="c4-name">Context</span><span class="c4-what">System boundary, actors</span></div>
          <div class="c4-mapping">→ Project node</div>
        </div>
        <div class="c4-row">
          <div class="c4-level"><span class="c4-name">Container</span><span class="c4-what">Deployable units, pipelines</span></div>
          <div class="c4-mapping">→ Subnetworks</div>
        </div>
        <div class="c4-row">
          <div class="c4-level"><span class="c4-name">Component</span><span class="c4-what">Core building blocks</span></div>
          <div class="c4-mapping">→ Service, Store, Queue, Gateway, External</div>
        </div>
        <div class="c4-row">
          <div class="c4-level"><span class="c4-name">Code</span><span class="c4-what">Implementation</span></div>
          <div class="c4-mapping">→ Agent reads compiled spec, writes code</div>
        </div>
      quote: '"C4 gives you the structure. SpecDesigner fills it with contracts your agent can execute."'

