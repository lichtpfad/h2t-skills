  - component: principles-grid
    content:
      title: "Key Principles"
      cards_html: |
        <div class="card">
          <div class="card-label">Single Source of Truth</div>
          <div class="card-text">One place for architecture and specs. Git-versioned. Change a module — all downstream consumers see the update instantly. No manual sync, no stale docs, no drift.</div>
        </div>
        <div class="card">
          <div class="card-label">Progressive Disclosure</div>
          <div class="card-text">Hierarchical context from project down to task: rules → subsystem → module → neighbors. Delivered through any channel — REST API, MCP, file sync. Agent-agnostic by design.</div>
        </div>
        <div class="card">
          <div class="card-label">Visual Docs + Forced Clarity</div>
          <div class="card-text">Diagram and spec in one visual editor. Spec template makes you describe what a module does, what it doesn't, and when it's done — before any code is written.</div>
        </div>

  - component: screenshot-frame
    content:
      title: "See It In Action"
      image_src: "specdesigner.png"
      image_alt: "SpecDesigner — POS architecture graph with PostgreSQL node spec open"
      caption: "POS architecture in SpecDesigner — 12 nodes, subnetworks, compiled specs with Context API"

  - component: faq
    content:
      title: "FAQ"
      items_html: |
        <details class="faq-item">
          <summary>How is this different from draw.io?</summary>
          <p>draw.io draws diagrams. SpecDesigner makes each diagram node a structured spec with boundaries, acceptance criteria, and code mapping. Diagram and spec are one object — they never diverge.</p>
        </details>
        <details class="faq-item">
          <summary>Why not just write a good CLAUDE.md?</summary>
          <p>CLAUDE.md is one file for your entire project. It doesn't scale past 5-10 modules. SpecDesigner compiles per-module specs — each agent gets only the context it needs.</p>
        </details>
        <details class="faq-item">
          <summary>Does it work with Cursor / Codex / other agents?</summary>
          <p>Yes. SpecDesigner compiles to standard Markdown files. Any agent that reads files works: Claude Code, Cursor, Codex, Windsurf, GitHub Copilot. MCP Server also available.</p>
        </details>
        <details class="faq-item">
          <summary>Is it open source?</summary>
          <p>The product is closed source. The Agent Spec Template (spec format) is open and free to use. Early access is free for focus group participants. Pricing TBD after feedback.</p>
        </details>
        <details class="faq-item">
          <summary>What does "forced clarity" mean?</summary>
          <p>The spec template (summary, boundaries, acceptance criteria, code mapping) forces you to think through each module before coding. Users report this is valuable even without an AI agent.</p>
        </details>

