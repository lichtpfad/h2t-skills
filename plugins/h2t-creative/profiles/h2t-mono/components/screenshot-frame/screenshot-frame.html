<section>
  <div class="container" style="text-align:center;">
    <div class="section-title">{{ title }}</div>
    <div style="max-width:960px; margin:0 auto; border:1px solid var(--border); border-radius:8px; overflow:hidden;">
      <img src="{{ image_src }}" alt="{{ image_alt }}" style="width:100%; height:auto; display:block;">
    </div>
    <p style="margin-top:var(--space-sm); font-size:12px; color:var(--fg-muted);">{{ caption }}</p>
  </div>
</section>
