# h2t-editorial deck — source dossier (R2b slice for #87).
#
# Catalog of golden references that gate desktop fidelity for the editorial
# deck form. Authoritative imports live under
#   docs/visual-regression/2026-05-07-r2b/h2t-editorial-deck-golden/
# and were locked during R2b T0 inventory. References here are static
# pointers; this dossier never instructs a runtime regenerator or model to
# reproduce content at session time — every entry is a fixed snapshot.
#
# Landing form (#88) has its own dossier in the codex/r2b-editorial-landing
# branch (separate slice). This file references DECK sources only.
#
# ⚠ SOURCE ARBITRATION RESET 2026-05-07
# Initial T1 designation marked pos-sprint-editorial-example as primary.
# Visual review revealed the human canonical target is the LUXURY-PRINT
# system embodied by rejuve-pitch-deck (gold accent + Playfair/Georgia +
# brand-wordmark cover), NOT the tech-article system shared by pos-sprint
# and rejuve-presentation (terracotta + Playfair/Inter + left-aligned
# article cover). Roles below are post-reset. Full arbitration report at
#   docs/superpowers/specs/2026-05-07-r2b-source-arbitration.md
# T1–T7 implementation artifacts (tokens, palettes, layouts, recipe, mobile
# CSS) are tied to System A and require rebuild before any visual pass.

profile: h2t-editorial
form: deck
slice: r2b-deck
gate: desktop-fidelity
mobile_gate: usability   # not "baseline-only" — mobile is Gate B per R2b plan
canonical_source: rejuve-pitch-deck   # post-arbitration (2026-05-07)
visual_system: B-luxury-print         # vs A-tech-article (pos-sprint family)

sources:
  - id: pos-sprint-editorial-example
    role: secondary
    visual_system: A-tech-article
    kind: golden-html
    path: docs/visual-regression/2026-05-07-r2b/h2t-editorial-deck-golden/pos-sprint-editorial-example.html
    notes: >-
      Original T1 designation: PRIMARY. Reclassified to SECONDARY by the
      2026-05-07 source arbitration reset. Represents the tech-article
      editorial system (System A): terracotta accent #c45a3c + Playfair
      Display headline + Inter body + left-aligned article cover with thin
      <hr> rule. Useful for layout vocabulary catalogue (the seven layout
      ids — title/title-body/quote/two-column/image-text/divider/final
      — are still valid concepts) but its tokens, color palette, body
      typography, and cover composition do NOT match the rejuve-pitch-deck
      canonical target. Do not re-elevate to primary without explicit
      human direction.

  - id: pos-sprint-deck-skill
    role: contract-only
    visual_system: A-tech-article
    kind: skill-doc
    path: docs/visual-regression/2026-05-07-r2b/h2t-editorial-deck-golden/pos-sprint-deck-SKILL.md
    notes: >-
      Specifies STYLE 2 (System A) typography stack (Playfair Display +
      Inter), token shape, and slide-structure HTML contract. SHARED
      §Slide Structure section is form-agnostic and still applies. The
      STYLE 2 typography prescription (Inter body) is NOT canonical for
      h2t-editorial — see canonical_source above. Treat this file as a
      contract reference for assembler shape (single-file output, slide
      sectioning, JS contract) but NOT for visual styling.

  - id: pos-sprint-deck-readme
    role: contract-only
    visual_system: A-tech-article
    kind: skill-readme
    path: docs/visual-regression/2026-05-07-r2b/h2t-editorial-deck-golden/pos-sprint-deck-README.md
    notes: >-
      Skill README — overview only. Not authoritative for visual styling
      after the 2026-05-07 arbitration reset.

  - id: rejuve-presentation
    role: secondary
    visual_system: A-tech-article
    kind: live-deck
    slides: 83
    path: docs/visual-regression/2026-05-07-r2b/h2t-editorial-deck-golden/rejuve-presentation.html
    notes: >-
      Live editorial presentation deck (Russian + English mix). Same visual
      system as pos-sprint-editorial-example: terracotta accent #c45a3c +
      Playfair Display + Inter body + 2px progress-bar + JetBrains Mono
      chrome (counter, mono caption details). Cover grammar: "PROPOSAL —
      DATE" kicker + brand wordmark + Playfair italic subtitle + uppercase
      meta caps line. NOT the canonical target — see canonical_source. Kept
      as a recipe-content reference for content-grammar exploration only;
      do not lift its tokens or palette.

  - id: rejuve-pitch-deck
    role: primary
    visual_system: B-luxury-print
    kind: live-deck
    slides: 15   # cover + 14 content slides per direct count (not 45 as in pre-reset note)
    path: docs/visual-regression/2026-05-07-r2b/h2t-editorial-deck-golden/rejuve-pitch-deck.html
    notes: >-
      Reclassified to PRIMARY by the 2026-05-07 arbitration reset. Embodies
      the LUXURY-PRINT editorial system (System B) that matches the human
      visual target for #87:
        • palette: gold accent #c9a96e + copper #7d4e2d + dim copper-text #8a6520
        • bg: warmer near-white #fafaf8 (vs A's #faf9f6)
        • typography: Playfair Display headings + GEORGIA serif body
          (NOT Inter — System B body is serif), system-ui sans for utility
          (counter, labels)
        • token shape: --fh / --fb / --fu (vs A's --font-heading / --font-body)
        • cover grammar: brand wordmark <div class="brand">RE<em>juve</em></div>
          (Playfair 58px, em fragment in accent gold) + uppercase letter-spaced
          .cover-sub + 40px×2px gold .rule decorator + sans .cover-meta
        • per-slide grammar: small uppercase .label kicker (10.5px, 2.5px
          letter-spacing, gold) + h2 (Playfair 27px) + .rule (40×2 gold)
          + body (Georgia 16.5px line-height 1.65)
        • progress-bar: 2px gold
        • counter: 11px sans dim, top-right
      Authoritative for tokens, palette, typography, cover composition,
      and chrome styling on the rebuild.

