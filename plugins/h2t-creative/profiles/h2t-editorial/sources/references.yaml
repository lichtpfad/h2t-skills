source_conflict:
  detected_at: 2026-05-07
  reset_kind: source-arbitration
  trigger: >-
    Human visual review of dist/r2b-h2t-editorial-deck-validation/index.html
    against the rejuve-pitch-deck reference screenshot revealed the
    implementation followed System A (pos-sprint editorial / tech-article),
    while the human canonical target is System B (rejuve-pitch-deck /
    luxury-print). The two systems diverge on: accent color, body font,
    cover composition, token-naming convention, and decorative rule usage.
  systems:
    A-tech-article:
      members: [pos-sprint-editorial-example, rejuve-presentation]
      accent:        "#c45a3c terracotta"
      body_font:     "Inter (sans)"
      heading_font:  "Playfair Display"
      cover_grammar: "left-aligned article OR centered Playfair italic subtitle + meta caps"
    B-luxury-print:
      members: [rejuve-pitch-deck]
      accent:        "#c9a96e gold"
      body_font:     "Georgia (serif)"
      heading_font:  "Playfair Display"
      cover_grammar: "centered brand wordmark + 40×2 accent rule + meta line"
  decision: >-
    Promote rejuve-pitch-deck to PRIMARY (canonical_source). Demote
    pos-sprint-editorial-example to SECONDARY. Demote rejuve-presentation
    to SECONDARY (alternate sub-style, recipe-content reference only).
    Keep pos-sprint deck-skill / readme as CONTRACT-ONLY references for
    assembler shape (single-file output, slide structure, JS contract).
    Full report: docs/superpowers/specs/2026-05-07-r2b-source-arbitration.md
  rebuild_required: true
  invalidated_artifacts:
    - "T1: profiles/h2t-editorial/deck/tokens.css (System A tokens — Playfair+Inter, terracotta vars)"
    - "T1: profiles/h2t-editorial/deck/palettes/{default,warm,night}.css (System A palettes)"
    - "T2: profiles/h2t-editorial/deck/slides/title/{title.html,title.css} (cover composition wrong: pos-sprint article vs pitch-deck brand wordmark)"
    - "T2: profiles/h2t-editorial/deck/slides/title-body/* (h2 size, body typography)"
    - "T2: profiles/h2t-editorial/deck/slides/quote/quote.css (System A typography stack)"
    - "T2: profiles/h2t-editorial/deck/slides/two-column/two-column.css (System A typography stack)"
    - "T2: profiles/h2t-editorial/deck/slides/image-text/image-text.css"
    - "T2: profiles/h2t-editorial/deck/slides/divider/divider.css"
    - "T2: profiles/h2t-editorial/deck/slides/final/final.css"
    - "T3: profiles/h2t-editorial/deck/frame/frame.css (chrome typography, progress-bar height, eyebrow style — pitch-deck uses .label not .eyebrow)"
    - "T5: profiles/h2t-editorial/validation/recipe-deck.yaml (copy lifted from pos-sprint slides 1-7 — replace with pitch-deck-derived copy)"
    - "T6: mobile @media blocks calibrated to System A sizes (typography scale will recompute under System B base sizes)"
    - "dist/r2b-h2t-editorial-deck-validation/* (build output — not commits)"
    - "docs/visual-regression/2026-05-07-r2b/h2t-editorial-deck-modular/* (14 captured screenshots — not visual evidence)"
  preserved_artifacts:
    - "Plugin assembler routing (_is_deck_form_profile + _assemble_deck_form_v2 — form-agnostic)"
    - "deck-nav.js (chrome JS contract is design-system-agnostic)"
    - "Layout vocabulary CONCEPT (7 layouts: title/title-body/quote/two-column/image-text/divider/final)"
    - "Manifest field shapes (need re-verification per layout but the schema concept holds)"
    - "Single-file output contract (T4)"
    - "Source dossier file (this file — restructured but kept)"
    - "image-text known_fidelity_gaps marker (still valid: pitch-deck has no <img> either)"
    - "Mobile Gate B contract (CSS-only, no JS branching)"
    - "Test suite scaffolding (helpers, parametrized matrices) — assertion *values* will need to update to System B tokens but the structural contracts hold"
  follow_up_phase: rebuild-around-pitch-deck
  rebuild_scope:
    - "Re-derive tokens.css from rejuve-pitch-deck: gold accent palette, Playfair+Georgia font stack, 2px progress-bar height, slide-padding tokens calibrated to pitch-deck spacing"
    - "Replace .eyebrow shared primitive with .label (pitch-deck uses .label kicker, not editorial-style eyebrow)"
    - "Add .rule decorative primitive (40×2px accent) to frame.css — pitch-deck uses it heavily (cover + per-slide kicker separator)"
    - "Rewrite title.html as brand-wordmark cover (.brand with em-fragment accent + .cover-sub + .rule + .cover-meta) — different field set than current title manifest"
    - "Rewrite per-layout CSS for System B typography (h1 42, h2 27, body Georgia 16.5)"
    - "Re-lift validation recipe content from rejuve-pitch-deck slides — Russian copy preserved verbatim or English-translated copy from a sibling pitch deck"
    - "Re-run T6 mobile coverage with System B sizes (matrix structure unchanged; values recompute)"
    - "Re-build → re-capture → human visual approval"

known_fidelity_gaps:
  # Documented at R2b Batch A.5 (2026-05-07) — kept here so the visual parity
  # gate at T8/T9 explicitly excludes the marked layouts/slides from desktop
  # fidelity scoring rather than silently failing on missing golden coverage.
  - layout: image-text
    reason: >-
      None of the locked editorial deck goldens
      (pos-sprint-editorial-example, rejuve-presentation, rejuve-pitch-deck)
      contain photographic <img> assets or background-image references —
      they are all prose + structural typography. The image-text layout is
      part of the editorial vocabulary catalogued by the pos-sprint deck
      skill, but no golden slide exercises it visually.
    stub_kind: data-uri-svg-rect
    stub_intent: >-
      Neutral two-tone rectangle inlined as a data-URI SVG so the slide
      assembles, renders without a broken-image icon, and the LAYOUT
      structure (figure / figcaption / body composition) remains testable.
      Intentionally not styled to look like editorial content — it is a
      structural marker, not synthetic visual evidence.
    parity_gate: excluded   # image-text slide is NOT scored for fidelity at T8/T9
    next_step: >-
      If a real editorial image asset surfaces (or rejuve client supplies a
      figure), swap the data-URI for that asset and reinstate the slide
      into the visual parity gate.

notes: >-
  Reference screenshots are slide-01 only per source (single static frame for
  quick golden diffing). Per-slide capture across the 11/45/83 sources is not
  required at T1 — that lands during R2b implementation Agent Visual QA via
  tools/deck-screenshot-all.py against the assembled validation deck.
