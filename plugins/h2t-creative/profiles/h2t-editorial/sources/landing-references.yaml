# h2t-editorial LANDING — source dossier (R2b slice for #88).
#
# Catalog of golden references that gate desktop fidelity for the editorial
# LANDING form. Authoritative imports live under
#   docs/visual-regression/2026-05-07-r2b/h2t-editorial-landing-golden/
# (rejuve-appendix-* HTMLs + reference screenshots, locked at R2b T0).
# References here are static pointers; this dossier never instructs a
# runtime regenerator or model to reproduce content at session time —
# every entry is a fixed snapshot.
#
# Deck form (#87) has its own dossier in `references.yaml` (already merged
# into main via PR #102). This file references LANDING sources only,
# plus one CONTRACT-ONLY brand reference back to the deck primary so the
# shared System B brand identity (gold + Playfair) stays anchored.
#
# T0.5 Source Arbitration Visual Gate (2026-05-07): both landing goldens
# share System B-Landing — denser article-density variant of deck's
# System B (rejuve-pitch-deck). NO source conflict; full report at
#   docs/superpowers/specs/2026-05-07-r2b-landing-source-arbitration.md

profile: h2t-editorial
form: landing
slice: r2b-landing
gate: desktop-fidelity
mobile_gate: usability
visual_system: B-landing       # vs deck's B-luxury-print

arbitration:
  date: "2026-05-07"           # quoted to preserve string type across YAML loaders
  step: T0.5
  conflict_detected: false
  decision: >-
    Both landing goldens share System B-Landing (gold accent #c9a96e +
    Playfair Display serif headings + system-ui sans body + warm cream
    #fafaf8). Denser type scale than deck's System B (h1 28 vs 42, body
    14 vs 16.5) — landing-density vs slide pacing. No conflict.
  spec: docs/superpowers/specs/2026-05-07-r2b-landing-source-arbitration.md
  primary_choice_reason: >-
    competitive-report exercises the wider primitive set (page header +
    3-up stat hero + categorized cards + side-by-side comparison columns
    + 16-row sortable competitor table + footnotes); elpodium is
    secondary as a table-heavy / responsibility-matrix variant of the
    same system.

sources:
  - id: rejuve-appendix-competitive-report
    role: primary
    visual_system: B-landing
    kind: golden-html
    path: docs/visual-regression/2026-05-07-r2b/h2t-editorial-landing-golden/rejuve-appendix-competitive-report.html
    notes: >-
      Long-form competitive-landscape report. Authoritative for the
      System B-Landing token block (gold + Playfair + system-ui sans),
      page-header grammar, 3-up stat hero, 4-category card grid,
      side-by-side criteria-comparison columns, and the 16-row sortable
      competitor table with badge / pill cells. Token shape uses short
      names (--ac / --ad / --tx / --mu / --bd / --sf / --gr / --dn /
      --bl / --r / --serif / --sans).

  - id: rejuve-appendix-elpodium-decomposition
    role: secondary
    visual_system: B-landing
    kind: golden-html
    path: docs/visual-regression/2026-05-07-r2b/h2t-editorial-landing-golden/rejuve-appendix-elpodium-decomposition.html
    notes: >-
      Long-form decomposition report. Same visual system as
      competitive-report; recipe-content reference for table-heavy
      patterns: 12-row priority-coded table with criticality cell tints,
      wave-staged phasing, full-width responsibility matrix. Adds the
      `--pu` (#882299) palette extension for a 5th semantic colour that
      competitive-report does not need. The extension is included in
      canonical landing tokens so this secondary's content patterns can
      be reused without palette divergence.

  - id: rejuve-pitch-deck
    role: contract-only
    visual_system: B-luxury-print
    kind: brand-reference
    path: docs/visual-regression/2026-05-07-r2b/h2t-editorial-deck-golden/rejuve-pitch-deck.html
    notes: >-
      DECK form primary (PR #102 / commit 31ac606). Anchors the shared
      System B brand identity: gold #c9a96e accent, Playfair Display
      headings, warm cream #fafaf8 background. Type scale and cover
      composition are deck-only (h1 42, body Georgia 16.5, brand
      wordmark cover) — landing form intentionally diverges to
      article-density (h1 28, body system-ui 14, page header). Use as a
      brand-identity anchor only; do NOT lift typography or component
      sizing into landing CSS.

reference_screenshots:
  - source: rejuve-appendix-competitive-report
    desktop: docs/visual-regression/2026-05-07-r2b/h2t-editorial-landing-golden/screenshots-rejuve-appendix-competitive-report/unknown/desktop_20260507_013314.png
    mobile:  docs/visual-regression/2026-05-07-r2b/h2t-editorial-landing-golden/screenshots-rejuve-appendix-competitive-report/unknown/mobile_20260507_013314.png
  - source: rejuve-appendix-elpodium-decomposition
    desktop: docs/visual-regression/2026-05-07-r2b/h2t-editorial-landing-golden/screenshots-rejuve-appendix-elpodium-decomposition/unknown/desktop_20260507_013317.png
    mobile:  docs/visual-regression/2026-05-07-r2b/h2t-editorial-landing-golden/screenshots-rejuve-appendix-elpodium-decomposition/unknown/mobile_20260507_013317.png

token_strategy:
  approach: layer-alongside
  rationale: >-
    R1 landing form already ships with `--color-*` tokens used by the
    existing components (cta / footer / hero / nav / section). Renaming
    them to System B-Landing short names would have a wide blast radius
    on the existing landing components. Instead, T1 LAYERS the System
    B-Landing canonical short tokens (--ac / --ad / --tx / --mu / --bd
    / --sf / --gr / --dn / --bl / --pu / --r / --serif / --sans)
    alongside the R1 namespace. New / recovered components target
    System B-Landing short tokens; legacy R1 components keep working
    against --color-* until they are individually recovered.
  preserved_r1_tokens:
    - --color-bg
    - --color-bg-light
    - --color-bg-card
    - --color-text
    - --color-text-dim
    - --color-accent
    - --color-border
    - --color-accent-hover
    - --color-on-accent

notes: >-
  Reference screenshots are full-page renders per source (single static
  frame, both viewports). Per-section visual capture during landing
  recovery (later T) lives under docs/visual-regression/<date>-r2b-landing/
  alongside the parity-notes for each section.
