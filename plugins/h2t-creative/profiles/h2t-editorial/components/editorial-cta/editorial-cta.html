<div class="editorial-cta">
  <span class="editorial-cta__label">{{ label }}</span>
  <h3 class="editorial-cta__title">{{ title }}</h3>
  <p class="editorial-cta__body">{{ body }}</p>
  <a class="editorial-cta__primary" href="{{ primary_href }}">{{ primary_label }}</a>
  <a class="editorial-cta__secondary" href="{{ secondary_href }}">{{ secondary_label }}</a>
</div>
