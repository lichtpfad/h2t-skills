EXA_API_KEY:
  description: "Exa semantic search API key"
  url: "https://dashboard.exa.ai/api-keys"
  validator: uuid
  connector: research

NOTION_API_TOKEN:
  description: "Notion integration token"
  url: "https://www.notion.so/profile/integrations"
  validator: "starts_with:secret_"
  connector: notion

MEETGEEK_API_KEY:
  description: "MeetGeek API key"
  url: "https://app.meetgeek.ai/settings/api"
  validator: nonempty
  connector: meetgeek

GRANOLA_API_KEY:
  description: "Granola API key"
  url: "https://notes.granola.ai/settings/api"
  validator: "starts_with:grn_"
  connector: granola
