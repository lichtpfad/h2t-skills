# Structure guard configuration for h2t-skills
# Used by plugins/h2t-core/hooks-handlers/structure_guard.py

# Every top-level directory that holds tracked files must be listed here.
# An unlisted directory is now BLOCKED, not warned about — and the list had
# drifted six entries behind the repo, which is why it could only warn.
# tests/hooks/test_structure_guard.py keeps it in sync with `git ls-files`.
allowed_root_dirs:
  - plugins/
  - docs/
  - h2t_ops/
  - lib/
  - scripts/
  - tests/
  - tools/
  - evals/
  - hooks/
  - hooks-handlers/
  - .h2t/
  - .claude/
  - .claude-plugin/
  - .github/

forbidden_patterns:
  - "tmp_*"
  - "*_tmp.*"
  - "*_v2.*"
  - "*_copy.*"
  - "*_backup.*"

plan_dirs:
  - path: "docs/superpowers/plans/"
    pattern: "^\d{4}-\d{2}-\d{2}-.+\.md$"

# Dirs whose Markdown files must open with a --- frontmatter block.
# Presence-only warn (structure_guard); field-level validation is docs-lint's job.
frontmatter_dirs:
  - docs/superpowers/plans/
  - docs/superpowers/specs/
  - docs/adr/
